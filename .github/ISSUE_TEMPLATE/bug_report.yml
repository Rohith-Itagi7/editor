name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. A screenshot or screen recording helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a file
        2. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you run it
      options:
        - Browser (node serve.mjs)
        - Desktop app (npm start)
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / OS and version
